; CYD Solar Monitor – Solar Assistant via MQTT
; Scheda: ESP32-2432S028R "Cheap Yellow Display"

[env:cyd]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    knolleary/PubSubClient@^2.8
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; Configurazione TFT_eSPI tramite build flags (non serve modificare User_Setup.h della libreria)
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    ; Se lo schermo resta bianco o i colori sono invertiti (CYD con 2 USB), sostituisci
    ; la riga sopra con:  -D ST7789_DRIVER=1  e aggiungi  -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
